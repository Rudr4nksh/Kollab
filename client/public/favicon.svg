<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="kollabFaviconBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B28" />
      <stop offset="100%" stop-color="#0B0E17" />
    </linearGradient>
  </defs>
  <!-- Dark squircle container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#kollabFaviconBg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Pure Geometric 'K' Mark - Clean stem and diagonal arms -->
  <!-- Vertical white stem -->
  <rect x="18.5" y="14" width="7" height="36" rx="2" fill="#FFFFFF" />

  <!-- Upper diagonal arm (Electric blue) -->
  <line x1="25.5" y1="31" x2="42.5" y2="15.5" stroke="#3B82F6" stroke-width="7" stroke-linecap="round" />

  <!-- Lower diagonal leg (Sky blue) -->
  <line x1="25.5" y1="33" x2="42.5" y2="48.5" stroke="#60A5FA" stroke-width="7" stroke-linecap="round" />
</svg>
